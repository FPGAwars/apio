// Common protocol buffers definitions that are imported by other
// protocol buffer files.

// IMPORTANT: After making changes in this file, run the repo task
// 'invoke update-protos' to propagate them to the python stubs.
//  Otherwise they do not take affect.

// Using proto2 for features such as 'has' and 'required'.
syntax = "proto2";


package apio.common.proto;

// The supported FPGA architectures.
// Using lower case names to be json friendly.
enum ApioArch {
  ice40 = 1;
  ecp5 = 2;
  gowin = 3;
  xilinx = 4;
}


// Contain a string pair of a name and a value.
message NameValue {
  required string name = 1;
  required string value = 2;
}

// Contains env var mutations that should be performed in the env that
// is passed to subprocesses (yosys, scons, format, raw, etc.). The mutations
// are applied in the order of the proto fields here.
message EnvMutations {
  // Path values to prepend to the path, preserving the order.
  repeated string add_to_path = 1;
  
  // List of env vars to delete if exist.
  repeated string delete_env_var = 2;

  // Env vars to set, overwriting if already exist.
  repeated NameValue add_env_vars = 3;

  // Fix for pyinstaller.
  required bool pyinstaller_linux_fix = 4;
}
