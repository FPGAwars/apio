// Protocol buffers definitions used by apio.  Currently we use them just
// for passing parameters from the apio process to the scons process.

// IMPORTANT: After making changes in this file, run the repo task
// 'invoke update-protos' to propagate them to the python stubs.
//  Otherwise they do not take affect.

// Using proto2 for features such as 'has' and 'required'.
syntax = "proto2";

package apio.common.proto;

import "apio/common/proto/apio-common.proto";

// ====================== Board definition ===========================

// The board's programmer info.
message BoardProgrammerSection {
  required string id = 1;
  optional string extra_args = 2 [json_name = "extra-args"];
}

// The board's USB info.
message BoardUsbSection {
  optional string vid = 1;
  optional string pid = 2;
  optional string product_regex = 3 [json_name = "product-regex"];
}

// The board's tinyprog specific info.
message BoardTinyprogSection {
  required string name_regex = 1 [json_name = "name-regex"];
}

// The board definition.
message BoardDefinition {
  required string description = 1;
  required string fpga_id = 2 [json_name = "fpga-id"];
  required BoardProgrammerSection programmer = 3;
  optional BoardUsbSection usb = 4;
  optional BoardTinyprogSection tinyprog = 5;
}


// ====================== FPGA definition ===========================

message FpgaIce40Params {
  required string type = 1;
  required string package = 2;
}

message FpgaEcp5Params {
  required string type = 1;
  required string package = 2;
  required string speed = 3;
}

message FpgaGowinParams {
  required string yosys_family = 1 [json_name = "yosys-family"];
  required string nextpnr_family = 2 [json_name = "nextpnr-family"];
  required string packer_device = 3 [json_name = "packer-device"];
}

message FpgaXilinxParams {
  required string yosys_family = 1 [json_name = "yosys-family"];
  required string yosys_arch = 2 [json_name = "yosys-arch"];
  required string yosys_part = 3 [json_name = "yosys-part"];
  required string speed = 4;
}

message FpgaDefinition {
  required string part_num = 1 [json_name = "part-num"];
  required ApioArch arch = 2;
  required string size = 3;

  oneof arch_params {
    FpgaIce40Params ice40_params = 10 [json_name = "ice40-params"];
    FpgaEcp5Params ecp5_params = 11 [json_name = "ecp5-params"];
    FpgaGowinParams gowin_params = 12 [json_name = "gowin-params"];
    FpgaXilinxParams xilinx_params = 13 [json_name = "xilinx-params"];
  }
}


// ====================== Board definition ===========================

message ProgrammerDefinition {
  required string command = 1;
  required string args = 2;
}
