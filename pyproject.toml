# Apio's project file.
# Package version is set in apio/__init__.py

[build-system]
requires = ["flit_core>=4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "apio"
description = "FPGA development made easy"

# Version is read from __version__: str in apio/__init__.py
dynamic = ["version"]

authors = [
    {name = "Jesus Arroyo", email = "jesus.jkhlg@gmail.com"},
]
# For convenience, we use the same readme file for the github repo
# and for PyPi. Can split them if needed.
readme = "README.md"

license = "GPL-3.0-or-later"

license-files = ["LICENSE"]

classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Environment :: Console',
        'Intended Audience :: Developers',
        # "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        'Natural Language :: English',
        'Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)',
        "Operating System :: Microsoft :: Windows",
        "Operating System :: POSIX :: Linux",
        "Operating System :: MacOS",
]

requires-python = ">=3.11"

dependencies = [
    'click==8.2.1',
    'colorama==0.4.6',
    'configobj==5.0.9',
    'debugpy==1.8.19',
    'packaging==25.0',
    'pyserial==3.5',
    'requests==2.33.1',
    'scons==4.8.1',
    'semantic_version==2.10.0',
    'wheel==0.45.1',
    'blackiceprog==2.0.0',
    'tinyfpgab==1.1.0',
    'tinyprog==1.0.21',
    'icefunprog==2.0.3',
    'apollo_fpga==1.1.1',
    'protobuf==6.33.5',
    'rich==14.0.0',
    'vcdvcd==2.6.0',
    'invoke==2.2.1',
    'json5==0.15.0',
]

[project.optional-dependencies]
# Extra modules with type information that mypy needs to analyze the
# type consistency.
mypy = [
    "types-protobuf>=6.32.1,<7",
    "types-requests>=2.33.0,<2.34",
    "types-pyserial>=3.5.0.2024,<3.6",
    "types-jsonschema>=4.26.0.20260518,<4.27",
]

[project.urls]
"Homepage" = "https://github.com/fpgawars/apio"
"Documentation" = "https://fpgawars.github.io/apio/docs"
"Bugs Tracker" = "https://github.com/fpgawars/apio/issues"
"Discussions" = "https://github.com/fpgawars/apio/discussions"
"Apio IDE" = "https://marketplace.visualstudio.com/items?itemName=fpgawars.apio"

[project.scripts]
apio = "apio.__main__:main"

[[tool.mypy.overrides]]
# Supress mypy warning for these imported modules since type stubs are
# not available for them.
module = [
    "configobj",
    "configobj.*",
    "SCons",
    "SCons.*",
    "usb",
    "usb.*",
    "vcdvcd",
    "vcdvcd.*",
    "google.protobuf.unknown_fields",
]
ignore_missing_imports = true

[tool.flit.sdist]
# Note that we don't include 'media/' nor do we have relative references
# from README.md to resources in media since pypi doesn't show them
# correctly. Instead we use absolute links to github.
include = [
    "apio/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    # This file is added by the apio build workflow.
    "BUILD-INFO.json",
]

[tool.black]
line-length = 79
target-version = ['py311']

# NOTE: For pylint control see .pylintrc in this directory.
# It allows controls that pyproject.toml doesn't support.

# NOTE: The publish-to-pypi.yaml workflow automatically appends here
# release information before submitting to pypi. This allows the repo
# crawler to map the pypi release to the apio release.
# Example:
# [tool.apio-release]
# repo = "fpgawars/apio"
# tag = "2026-09-07"
# commit = "51cba17ba7913c2f3d4bd3f7e471db9174a64a6c"