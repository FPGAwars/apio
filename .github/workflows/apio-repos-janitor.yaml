# A periodic workflow to crawl, analyze, fix, clean, and verify the
# Apio's repositories.

name: apio-repos-janitor

on:
  # Run on commit.
  push:

  # Run every 6 hours
  # schedule:
  #   - cron: "0 */6 * * *"

  # Allow manual launch
  workflow_dispatch:

jobs:
  janitor:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # -- We need the apio repo for the janitor scripts.
      - name: Checkout Apio's main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up latest Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install python dependencies
        run: |
          pip install -r scripts/janitor/requirements.txt

      - name: Run the crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.janitor.crawler --janitor-data-dir ./_janitor-data

      - name: Show crawler results
        run: |
          cat ./_janitor-data/crawl-results.json

      - name: Run the analyzer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.janitor.analyzer --janitor-data-dir ./_janitor-data

      - name: Show analyzer results
        run: |
          cat ./_janitor-data/analysis-results.json

      - name: Run the pre verifier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.janitor.verifier --phase pre --janitor-data-dir ./_janitor-data

      - name: Show pre verifier results
        run: |
          cat ./_janitor-data/pre-verification-results.json

      - name: Run the Fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.janitor.fixer --janitor-data-dir ./_janitor-data

      - name: Show fixer results
        run: |
          cat ./_janitor-data/fixing-results.json

      - name: Run the post verifier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.janitor.verifier --phase post --janitor-data-dir ./_janitor-data

      - name: Show post verifier results
        run: |
          cat ./_janitor-data/post-verification-results.json

      - name: Write post verification results to summary
        run: |
          {
            echo '## Post verification results'
            echo
            echo '```json'
            cat ./_janitor-data/post-verification-results.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the json files as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: janitor-json
          path: ./_janitor-data/*.json
          if-no-files-found: error

      - name: Fail if post verifications has failures
        run: |
          # -- Dump failures, if any
          jq '{failures: .failures}' _janitor-data/post-verification-results.json
          # -- Fail if passed is not true.
          jq -e '.passed == true' ./_janitor-data/post-verification-results.json > /dev/null
